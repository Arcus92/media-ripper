name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: MediaRipper
  PROJECT_PATH: ./MediaRipper/MediaRipper.csproj
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            package_extension: zip
          - os: ubuntu-latest
            runtime: linux-x64
            package_extension: tar.gz
          - os: macos-latest
            runtime: osx-x64
            package_extension: tar.gz
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release
          -f net10.0
          -r ${{ matrix.runtime }}
          -o publish/${{ matrix.runtime }}
            
      - name: Package
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/${{ matrix.runtime }}/* -DestinationPath ${{ env.APP_NAME }}-${{ matrix.runtime }}.zip
        shell: pwsh

      - name: Package
        if: runner.os != 'Windows'
        run: |
          cd publish/${{ matrix.runtime }}
          chmod +x ${{ env.APP_NAME }}
          tar -czf ../../${{ env.APP_NAME }}-${{ matrix.runtime }}.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.runtime }}
          path: ${{ env.APP_NAME }}-${{ matrix.runtime }}.${{ matrix.package_extension }}